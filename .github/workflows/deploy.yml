name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html이 생성되지 않았습니다. 빌드가 실패한 것으로 판단합니다."
            exit 1
          fi
          if [ ! -s "dist/index.html" ]; then
            echo "::error::dist/index.html이 비어 있습니다."
            exit 1
          fi
          echo "빌드 산출물 확인 완료:"
          ls -la dist/
          du -sh dist/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  smoke-test:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 배포된 사이트 응답 확인
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "확인 대상: $URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "시도 $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "배포 확인 완료 (HTTP 200)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::5회 재시도에도 사이트가 정상 응답하지 않습니다 (마지막 상태: $STATUS)"
          exit 1
